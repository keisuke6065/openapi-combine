name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '💣 Breaking changes'
    when:
      label: 'breaking'
  - title: '🚀 Features'
    when:
      label: 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      label: 'bug'
  - title: '🧰 Maintenance'
    when:
      label: 'chore'
  - title: '🗒 Documentation'
    when:
      label: 'documentation'
  - title: '🚀 Dependencies'
    when:
      label: 'dependencies'
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'
  # Version resolution. Changes matching no resolver fall back to the
  # built-in default increment, which is 'patch'.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
        - 'enhancement'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
        - 'dependencies'
        - 'bug'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
autolabeler:
  - label: 'chore'
    files:
      - '*.md'
    branch:
      - '/docs{0,1}\/.+/'
      - '/chore/.+/'
  - label: 'bug'
    branch:
      - '/bugfix\/.+/'
      - '/bug\/.+/'
    title:
      - '/fix/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
template: |
  ## Changes
  $CHANGES
